<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>EdukasiQ — Wawasan Baru Setiap Scan</title>
  <meta name="description" content="Proker KKN EdukasiQ: Portal ilmu pengetahuan acak terverifikasi. Scan barcode dan dapatkan wawasan baru setiap hari!">
  
  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- CSS Utama -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Library External Ringan (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- Background Cyber Glassmorphism Blobs -->
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- App Wrapper (Full Width & Fleksibel di Semua Device) -->
  <div class="app-container" style="width: 100%; max-width: 100%; margin: 0 auto; padding: 24px 4vw 80px;">
    
    <!-- HEADER BERSIH TANPA KOTAK CONTAINER (LOGO KIRI, TOMBOL KANAN) -->
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0 24px 0; margin-bottom: 32px;">
      
      <!-- Logo Web di Pojok Kiri Atas -->
      <div style="cursor: pointer; display: flex; align-items: center;" onclick="window.location.reload();">
        <h1 style="font-size: 1.8rem; font-weight: 800; margin: 0; background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px;">
          EdukasiQ
        </h1>
      </div>

      <!-- Tombol Audio & Mode Gelap/Terang di Pojok Kanan Atas Layar -->
      <div style="display: flex; align-items: center; gap: 14px;">
        <button id="soundToggleBtn" class="icon-btn" title="Aktifkan/Matikan Suara" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-primary); font-size: 1.15rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;">
          🔊
        </button>
        <button id="themeToggleBtn" class="icon-btn" title="Ganti Tema Gelap/Terang" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-primary); font-size: 1.15rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;">
          🌙
        </button>
      </div>

    </header>

    <!-- MAIN CONTENT AREA: FOKUS 100% PADA BACAAN ILMU ACAK -->
    <main>
      <section id="reader-section">
        


        <!-- Main Fact Card Container -->
        <div id="scanDisplayContainer">
          <!-- Populated dynamically via app.js -->
        </div>

      </section>
    </main>
    
    <!-- FOOTER MINIMALIS & BERSIH (TIDAK MENCOLOK) -->
    <footer style="margin-top: 80px; text-align: center; border-top: 1px solid var(--glass-border); padding-top: 32px; padding-bottom: 24px; color: var(--text-tertiary); font-size: 0.9rem;">
      <p style="margin: 0; font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; gap: 8px;">
        <span>EdukasiQ</span>
        <span style="color: var(--text-tertiary);">•</span> 
        <a href="#qr-studio" id="openQrModalBtn" style="color: var(--accent-primary); text-decoration: none; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
          <span>Bagikan Portal</span>
        </a>
      </p>
    </footer>

  </div>

  <!-- MODAL QR CODE & SHARE LINK WEB (PROFESIONAL & SIAP SEBAR) -->
  <div id="qrModal" class="modal-overlay" aria-hidden="true" role="dialog">
    <div class="modal-content" style="max-width: 440px; text-align: center; padding: 40px 32px; border: 1px solid var(--glass-border); border-radius: 24px;">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 1.5rem;">🔗</span>
          <h3 style="font-size: 1.3rem; font-weight: 800; margin: 0; color: var(--text-primary);">Bagikan EdukasiQ</h3>
        </div>
        <button id="closeQrModalBtn" class="close-btn" aria-label="Tutup" style="position: static; transform: none; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border-radius: 50%; cursor: pointer; border: none; color: var(--text-primary); transition: background 0.2s;">✕</button>
      </div>

      <p style="color: var(--text-secondary); margin-bottom: 32px; font-size: 0.95rem; line-height: 1.6;">
        Unduh gambar QR Code atau bagikan tautan website ini untuk menebar wawasan dan ilmu bermanfaat setiap hari!
      </p>

      <!-- 1. BAGIAN QR CODE -->
      <div style="background: #ffffff; padding: 24px; border-radius: 24px; display: inline-block; box-shadow: 0 15px 35px rgba(0,0,0,0.2); margin-bottom: 24px; border: 3px solid #00F2FE;">
        <canvas id="qrCanvas"></canvas>
      </div>

      <button id="downloadStickerBtn" class="btn-primary" style="width: 100%; justify-content: center; background: var(--accent-gradient); color: #0F172A; font-weight: 800; padding: 14px; border-radius: 12px; border: none; cursor: pointer; font-size: 1rem; box-shadow: 0 8px 20px rgba(0,242,254,0.25); margin-bottom: 32px; transition: transform 0.2s;">
        <span>📥</span> Unduh QR Code
      </button>

      <!-- GARIS PEMBATAS -->
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px; color: var(--text-tertiary); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.5px;">
        <div style="flex: 1; height: 1px; background: var(--glass-border);"></div>
        <span>ATAU BAGIKAN TAUTAN</span>
        <div style="flex: 1; height: 1px; background: var(--glass-border);"></div>
      </div>

      <!-- 2. BAGIAN LINK WEB -->
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <input type="text" id="shareUrlInput" readonly value="https://edukasiq-kkn.vercel.app" style="flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--glass-border); background: var(--bg-secondary); color: var(--text-primary); font-size: 0.9rem; font-weight: 600; text-align: center; outline: none;">
        <button id="copyLinkBtn" class="btn-secondary" style="padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; white-space: nowrap; background: var(--glass-bg-hover); color: var(--text-primary); border: 1px solid var(--glass-border); display: flex; align-items: center; gap: 6px; transition: background 0.2s;">
          <span>📋</span> Salin
        </button>
      </div>

      <button id="shareWebBtn" class="btn-secondary" style="width: 100%; justify-content: center; background: #25D366; color: #ffffff; font-weight: 800; padding: 14px; border-radius: 12px; border: none; cursor: pointer; font-size: 1rem; box-shadow: 0 8px 20px rgba(37,211,102,0.25); display: flex; align-items: center; gap: 8px; transition: transform 0.2s;">
        <span>💬</span> Bagikan ke WhatsApp
      </button>

    </div>
  </div>

  <!-- Data Basis Pengetahuan & Script -->
  <script src="js/facts-data.js"></script>
  <script src="js/qr-generator.js"></script>
  <script src="js/app.js"></script>

  <style>
    @media (max-width: 640px) {
      .qr-grid-layout {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</body>
</html>
