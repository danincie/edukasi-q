<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>EdukasiQ — Wawasan Baru Setiap Scan</title>
  <meta name="description" content="Proker KKN EdukasiQ: Portal ilmu pengetahuan acak terverifikasi. Scan barcode dan dapatkan wawasan baru setiap hari!">
  
  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- CSS Utama -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Library External Ringan (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- Background Cyber Glassmorphism Blobs -->
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- App Wrapper (Full Width & Fleksibel di Semua Device) -->
  <div class="app-container" style="width: 100%; max-width: 100%; padding: 20px 3vw 60px;">
    
    <!-- HEADER BERSIH TANPA KOTAK CONTAINER (LOGO KIRI, TOMBOL KANAN) -->
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0 20px 0; margin-bottom: 20px;">
      
      <!-- Logo Web di Pojok Kiri Atas -->
      <div style="cursor: pointer; display: flex; align-items: center;" onclick="window.location.reload();">
        <h1 style="font-size: 2.2rem; font-weight: 800; margin: 0; background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px;">
          EdukasiQ
        </h1>
      </div>

      <!-- Tombol Audio & Mode Gelap/Terang di Pojok Kanan Atas Layar -->
      <div style="display: flex; align-items: center; gap: 12px;">
        <button id="soundToggleBtn" class="icon-btn" title="Aktifkan/Matikan Suara" style="width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-primary); font-size: 1.15rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;">
          🔊
        </button>
        <button id="themeToggleBtn" class="icon-btn" title="Ganti Tema Gelap/Terang" style="width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-primary); font-size: 1.15rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;">
          🌙
        </button>
      </div>

    </header>

    <!-- MAIN CONTENT AREA: FOKUS 100% PADA BACAAN ILMU ACAK -->
    <main>
      <section id="reader-section">
        
        <!-- Top Action Bar (Acak Tombol Utama) -->
        <div style="text-align: center; margin-bottom: 24px;">
          <button id="scanRandomBtn" class="btn-primary" style="background: var(--accent-gradient); color: #fff; border: none; font-size: 1.15rem; font-weight: 800; padding: 16px 36px; border-radius: 99px; box-shadow: 0 10px 30px rgba(0,242,254,0.4); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; display: inline-flex; align-items: center; gap: 12px;">
            <span style="font-size: 1.4rem;">🎲</span> Acak Ilmu Berikutnya!
          </button>
          <div style="font-size: 0.85rem; color: var(--text-tertiary); margin-top: 10px;">
            Tekan tombol di atas atau scan ulang barcode untuk mendapatkan pengetahuan baru lainnya
          </div>
        </div>

        <!-- Main Fact Card Container -->
        <div id="scanDisplayContainer">
          <!-- Populated dynamically via app.js -->
        </div>

      </section>
    </main>

    <!-- FOOTER MINIMALIS & BERSIH (TIDAK MENCOLOK) -->
    <footer style="margin-top: 50px; text-align: center; border-top: 1px solid var(--glass-border); padding-top: 24px; color: var(--text-tertiary); font-size: 0.95rem;">
      <p style="margin: 0; font-weight: 600; color: var(--text-secondary);">
        EdukasiQ <span style="margin: 0 6px; color: var(--text-tertiary);">•</span> 
        <a href="#qr-studio" id="openQrModalBtn" style="color: var(--accent-primary); text-decoration: none; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">
          <span>🔗</span> Bagikan / Share
        </a>
      </p>
    </footer>

  </div>

  <!-- MODAL QR CODE & SHARE LINK WEB (PROFESIONAL & SIAP SEBAR) -->
  <div id="qrModal" class="modal-overlay" aria-hidden="true" role="dialog">
    <div class="modal-content" style="max-width: 480px; text-align: center; padding: 32px 24px; border: 1px solid var(--glass-border);">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 1.5rem;">🔗</span>
          <h3 style="font-size: 1.3rem; font-weight: 800; margin: 0; color: var(--text-primary);">Bagikan EdukasiQ</h3>
        </div>
        <button id="closeQrModalBtn" class="close-btn" aria-label="Tutup" style="position: static; transform: none;">✕</button>
      </div>

      <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 0.95rem; line-height: 1.6;">
        Unduh gambar QR Code atau bagikan tautan website ini untuk menebar wawasan dan ilmu bermanfaat setiap hari!
      </p>

      <!-- 1. BAGIAN QR CODE -->
      <div style="background: #ffffff; padding: 20px; border-radius: 20px; display: inline-block; box-shadow: 0 15px 35px rgba(0,0,0,0.3); margin-bottom: 20px; border: 4px solid #00F2FE;">
        <canvas id="qrCanvas"></canvas>
      </div>

      <button id="downloadStickerBtn" class="btn-primary" style="width: 100%; justify-content: center; background: var(--accent-gradient); color: #0F172A; font-weight: 800; padding: 14px; border-radius: 14px; border: none; cursor: pointer; font-size: 1rem; box-shadow: 0 8px 20px rgba(0,242,254,0.25); margin-bottom: 24px;">
        <span>📥</span> Unduh Gambar QR Code (PNG)
      </button>

      <!-- GARIS PEMBATAS -->
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px; color: var(--text-tertiary); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.5px;">
        <div style="flex: 1; height: 1px; background: var(--glass-border);"></div>
        <span>ATAU BAGIKAN LINK WEB</span>
        <div style="flex: 1; height: 1px; background: var(--glass-border);"></div>
      </div>

      <!-- 2. BAGIAN LINK WEB -->
      <div style="display: flex; gap: 8px; margin-bottom: 14px;">
        <input type="text" id="shareUrlInput" readonly value="https://edukasiq-kkn.vercel.app" style="flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--bg-secondary); color: var(--text-primary); font-size: 0.9rem; font-weight: 600; text-align: center;">
        <button id="copyLinkBtn" class="btn-secondary" style="padding: 12px 16px; border-radius: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; background: var(--glass-bg-hover); color: var(--text-primary); border: 1px solid var(--glass-border); display: flex; align-items: center; gap: 6px;">
          <span>📋</span> Salin
        </button>
      </div>

      <button id="shareWebBtn" class="btn-secondary" style="width: 100%; justify-content: center; background: #25D366; color: #ffffff; font-weight: 800; padding: 14px; border-radius: 14px; border: none; cursor: pointer; font-size: 1rem; box-shadow: 0 8px 20px rgba(37,211,102,0.25); display: flex; align-items: center; gap: 8px;">
        <span>💬</span> Bagikan ke WhatsApp / Sosmed
      </button>

    </div>
  </div>

  <!-- Data Basis Pengetahuan & Script -->
  <script src="js/facts-data.js"></script>
  <script src="js/qr-generator.js"></script>
  <script src="js/app.js"></script>

  <style>
    @media (max-width: 640px) {
      .qr-grid-layout {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</body>
</html>
